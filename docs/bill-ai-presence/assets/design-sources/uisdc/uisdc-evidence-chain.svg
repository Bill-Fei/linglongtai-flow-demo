<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">优设来源状态：作品集证据链</title>
  <desc id="desc">优设页面被安全策略拦截时，用本地视觉资产表达已沉淀的设计判断。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbf8"/>
      <stop offset="52%" stop-color="#eef7f2"/>
      <stop offset="100%" stop-color="#f7f2ec"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#5a766a" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="42" fill="url(#bg)"/>
  <g filter="url(#soft)">
    <rect x="82" y="80" width="796" height="380" rx="34" fill="#ffffff" fill-opacity=".76"/>
    <rect x="82" y="80" width="796" height="380" rx="34" fill="none" stroke="#d8e7de"/>
  </g>
  <text x="128" y="142" fill="#6f8178" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="22">UISDC SOURCE STATE</text>
  <text x="128" y="202" fill="#18251f" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="44" font-weight="700">作品集证据链</text>
  <text x="128" y="252" fill="#53655d" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="24">任务背景 / AI 协作流程 / 人工判断 / 验证结果 / 产出证据</text>
  <g fill="#173d31" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="22" font-weight="650">
    <rect x="128" y="312" width="168" height="58" rx="18" fill="#dff0e8"/>
    <text x="166" y="349">AI 动效</text>
    <rect x="318" y="312" width="168" height="58" rx="18" fill="#e8efe4"/>
    <text x="356" y="349">AI 大屏</text>
    <rect x="508" y="312" width="168" height="58" rx="18" fill="#f1ebe0"/>
    <text x="536" y="349">Codex + Obsidian</text>
  </g>
  <path d="M130 410 H830" stroke="#c7d9cf" stroke-width="3" stroke-linecap="round"/>
  <circle cx="170" cy="410" r="10" fill="#2c7a5b"/>
  <circle cx="378" cy="410" r="10" fill="#89a36e"/>
  <circle cx="586" cy="410" r="10" fill="#be9165"/>
  <circle cx="794" cy="410" r="10" fill="#2c7a5b"/>
</svg>
