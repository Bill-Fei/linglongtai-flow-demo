<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">优设来源状态：视觉规则</title>
  <desc id="desc">优设图源不可用时，保留可执行视觉规则。</desc>
  <rect width="960" height="540" rx="42" fill="#f8f5ef"/>
  <circle cx="770" cy="122" r="88" fill="#dfeee5"/>
  <circle cx="130" cy="430" r="108" fill="#ece4d7"/>
  <rect x="92" y="72" width="776" height="396" rx="38" fill="#ffffff" fill-opacity=".82" stroke="#e5ddd1"/>
  <text x="140" y="140" fill="#8a7b67" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="22">VISUAL RULES</text>
  <text x="140" y="202" fill="#2b241d" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="44" font-weight="700">不看破图，看规则</text>
  <g font-family="Inter, PingFang SC, Arial, sans-serif" font-size="24" font-weight="700" fill="#2f3a33">
