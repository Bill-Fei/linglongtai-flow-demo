  </g>
  <g fill="none" stroke="#b5c8b9" stroke-width="3">
    <rect x="520" y="258" width="250" height="38" rx="19"/>
    <rect x="520" y="322" width="188" height="38" rx="19"/>
    <rect x="520" y="386" width="222" height="38" rx="19"/>
  </g>
</svg>
